[theme]
base = "light"
primaryColor = "#00a862"

[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# Hide the Streamlit toolbar (hamburger menu, "Manage app", Deploy) from visitors.
# Only YOU (the owner) manage the app from share.streamlit.io — customers see a clean app.
toolbarMode = "minimal"
showErrorDetails = true
